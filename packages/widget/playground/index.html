<!doctype html>
<html lang="en" class="kl-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatbot Playground</title>
    <link rel="stylesheet" href="./themes.css" />
  </head>
  <body>
    <button type="button" id="pg-toggle" class="pg-toggle" aria-controls="pg-panel" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      Playground
    </button>
    <aside id="pg-panel" class="pg-panel" aria-label="Playground setup">
      <div class="pg-panel-head">
        <strong>Playground</strong>
        <button type="button" class="pg-collapse" aria-label="Hide the setup panel" title="Hide the setup panel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5" /></svg>
        </button>
      </div>
      <div class="pg-panel-body"></div>
      <div class="pg-panel-foot" aria-hidden="true"></div>
    </aside>
    <main class="pg">
      <div id="pg-banner" class="pg-banner" role="status" hidden></div>
      <h1>Chatbot Playground</h1>
      <p>The real chat widget on a plain page. The side panel sets up what you're testing; <strong>Design</strong> holds the look choices; <strong>Notes</strong> is for feedback, including on anything inside the chat.</p>
      <p class="pg-links" id="pg-links"></p>
      <div class="pg-swatches" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <iframe id="pg-phone" class="pg-phone" title="Phone-size preview" hidden></iframe>
    </main>
    <script type="module" src="./playground.ts"></script>
  </body>
</html>
